[package]
name = "subsonic"
version = "0.1.0"
edition = "2024"

[dependencies]
md5 = "0.8"
rand = "0.10"
reqwest = { version = "0.13", features = ["query", "json", "stream"] }
tokio = { version = "1.51", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
uuid = { version = "1.23", features = ["serde", "v4"] }
progenitor = "0.13"
regress = "0.11"
serde_urlencoded = "0.7.1"
http = "1.4"
thiserror = "2.0.18"
